<!DOCTYPE html>
<html>
<head>
    <title>jQuery DOM Operations</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        .myStyle {
            background-color: coral;
            padding: 16px;
        }
    </style>
</head>
<body>
    <div id="myElement">Original Text</div>
    <div id="myDIV">
        <p>I am a myDIV.</p>
    </div>
    <button id="myButton">Click me</button>
    <script>
        $(document).ready(function () {
            // a - Change text content using jQuery .text()
            $("#myElement").text("Modified Text");

            // b - Add CSS class using jQuery .addClass()
            $("#myDIV").addClass("myStyle");

            // c - Attach click event listener using jQuery .on("click", ...)
            $("#myButton").on("click", function () {
                alert("Button clicked!");
            });
        });
    </script>
</body>
</html>
